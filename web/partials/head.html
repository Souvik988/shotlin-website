  <script>document.documentElement.classList.add("js");try{if(sessionStorage.getItem("sl-v"))document.documentElement.classList.add("warm")}catch(e){}</script>
  <style>
    /* critical: loader paints instantly, page content stays hidden until styles are in */
    html.js:not(.ready) body{background:#07060f;margin:0}
    html.js:not(.ready) body>*:not(.veil):not(script){visibility:hidden!important}
    .veil{display:none}
    html.js .veil{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#07060f;color:#fff;font-family:"Bricolage Grotesque Variable",system-ui,sans-serif;overflow:hidden;--p:0;animation:vsafe 0s linear 10s forwards}
    @keyframes vsafe{to{visibility:hidden;pointer-events:none}}
    .veil__bg{position:absolute;inset:0;background:radial-gradient(40% 45% at 50% 46%,rgba(48,72,255,.42),transparent 70%),radial-gradient(25% 25% at 22% 82%,rgba(200,255,46,.12),transparent 70%);}
    .veil__bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(50% 50% at 50% 48%,#000,transparent 80%);mask-image:radial-gradient(50% 50% at 50% 48%,#000,transparent 80%)}
    .veil__core{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;margin-top:40px}
    .veil__orbit{position:relative;width:min(240px,62vw);aspect-ratio:1;display:grid;place-items:center}
    .veil__ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
    .veil__ring circle{fill:none;stroke-width:3}
    .vr-track{stroke:rgba(255,255,255,.1)}
    .vr-arc{stroke:#c8ff2e;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:calc(100 - var(--p));filter:drop-shadow(0 0 6px rgba(200,255,46,.6))}
    .veil__spin{position:absolute;inset:-14px;border-radius:50%;animation:vspin 2.6s linear infinite}
    .veil__spin--2{inset:-30px;animation-duration:4.2s;animation-direction:reverse}
    .veil__spin i{position:absolute;left:50%;top:0;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#38d6ff;box-shadow:0 0 14px #38d6ff}
    .veil__spin--2 i{background:#ff5cc8;box-shadow:0 0 14px #ff5cc8;width:7px;height:7px}
    @keyframes vspin{to{transform:rotate(360deg)}}
    .veil__bot{position:relative;width:58%;margin-top:8%}
    .veil__bot svg{width:100%;height:auto;display:block;overflow:visible}
    .vb-armL{animation:vtype .18s ease-in-out infinite alternate;transform-origin:44px 110px}
    .vb-armR{animation:vtype .18s ease-in-out .09s infinite alternate;transform-origin:96px 110px}
    @keyframes vtype{to{transform:translateY(3px) rotate(4deg)}}
    .vb-eyes{animation:vblink 3.2s infinite;transform-origin:70px 56px}
    @keyframes vblink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
    .vb-glow{animation:vglow 1.4s ease-in-out infinite alternate}
    @keyframes vglow{to{opacity:.35}}
    .veil__glyphs{position:absolute;left:50%;top:44%;width:0;height:0}
    .veil__glyphs b{position:absolute;font:700 14px "Geist Mono Variable",ui-monospace,monospace;color:#c8ff2e;opacity:0;animation:vglyph 1.8s linear infinite}
    .veil__glyphs b:nth-child(2){color:#38d6ff;animation-delay:.3s;left:-28px}
    .veil__glyphs b:nth-child(3){color:#ff5cc8;animation-delay:.6s;left:22px}
    .veil__glyphs b:nth-child(4){animation-delay:.9s;left:-12px}
    .veil__glyphs b:nth-child(5){color:#ffd23f;animation-delay:1.2s;left:30px}
    .veil__glyphs b:nth-child(6){color:#38d6ff;animation-delay:1.5s;left:-36px}
    @keyframes vglyph{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-90px) scale(1.1);opacity:0}}
    .veil__iconw{position:absolute;left:50%;top:-20%;width:40%;translate:-50% 0;z-index:2}
    .veil__icon{display:block;width:100%;height:auto;opacity:calc(.45 + var(--p)/180);filter:grayscale(calc(1 - var(--p)/100)) drop-shadow(0 16px 26px rgba(0,0,0,.55));animation:vfloat 2.2s ease-in-out infinite alternate}
    @keyframes vfloat{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-10px) rotate(4deg)}}
    .veil__log{list-style:none;margin:0;padding:0;display:grid;gap:4px;min-height:58px;font:500 11px "Geist Mono Variable",ui-monospace,monospace;color:rgba(255,255,255,.45);text-align:left}
    .veil__log li{opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s}
    .veil__log li.on{opacity:1;transform:none}
    .veil__log li.on::before{content:"✓ ";color:#c8ff2e}
    .veil__label{margin:0;font-weight:700;font-size:clamp(34px,5vw,64px);letter-spacing:-.05em;line-height:1}
    .veil__sub{margin:0;display:flex;gap:10px;align-items:center;font:500 11px "Geist Mono Variable",ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.6)}
    .veil__sub b{color:#c8ff2e;min-width:3ch;text-align:right}
    .veil__sub i{width:6px;height:6px;border-radius:50%;background:#c8ff2e;animation:vblink2 .8s infinite alternate}
    @keyframes vblink2{to{opacity:.2}}
    .reduced .veil{display:none!important}
  </style>
